name: identity_ocr
description: Offline Khmer and English OCR for captured identity documents.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IdentityOcrPlugin
        minimum_os_version: '16.0'
      android:
        package: com.piisiit.identity_ocr
        pluginClass: IdentityOcrPlugin
