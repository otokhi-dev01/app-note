name: ios_image_editor
description: A SwiftPM-compatible local patch of the native iOS image editor plugin.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IOSImageEditorPlugin
