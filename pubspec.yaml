name: Note
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.1+4 

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.4.0
  get_storage: ^2.1.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  ios_image_editor: ^1.0.0
  flutter_quill: ^11.0.0
  share_plus: ^10.1.4
  liquid_glass_widgets: ^0.29.5
  file_picker: ^8.1.2
  flutter_emoji: ^2.5.1

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/piisiit_logo_app.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
