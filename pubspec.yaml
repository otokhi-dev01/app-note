name: Note
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.4.0
  get_storage: ^2.1.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.3
  image: ^4.9.2
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  # Local SwiftPM-compatible patch of ios_image_editor 1.0.0.
  ios_image_editor:
    path: packages/ios_image_editor
  flutter_quill: ^11.0.0
  quill_native_bridge: ^11.1.0
  # Keep the Win32 dependency compatible with the pre-v12 file_picker pin.
  share_plus: 12.0.2
  url_launcher: ^6.3.2
  permission_handler: ^13.0.1
  liquid_glass_widgets: ^0.29.5
  # v12 pulls file_picker_darwin (iOS 14), which Flutter 3.44 incorrectly
  # places under a generated iOS 13 Swift package after each pub operation.
  file_picker: 11.0.3
  flutter_emoji: ^2.5.1
  pdf: ^3.13.0
  # Local patch adds an in-camera Gallery shutter control on iPhone while
  # preserving VisionKit document detection and the plugin's crop flow.
  cunning_document_scanner:
    path: packages/cunning_document_scanner
  record: ^7.1.1
  audioplayers: ^6.8.1
  video_player: ^2.11.1
  pdfx: ^2.11.0

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/piisiit_logo.jpg"
  min_sdk_android: 21

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
