name: Note
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.4.0
  get_storage: ^2.1.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  glassmorphism: ^3.0.0
  liquid_glass_renderer: ^0.2.0-dev.4
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  uuid: ^4.3.3
  flutter_spinkit: ^5.2.0
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  pro_image_editor: ^13.3.0
  flutter_quill: ^11.5.1

dev_dependencies:
